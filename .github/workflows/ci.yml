name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.envrc'
      - '.envrc.example'
      - '.devcontainer/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.envrc'
      - '.envrc.example'
      - '.devcontainer/**'

jobs:
  ci:
    uses: Sokol111/ecommerce-infrastructure/.github/workflows/go-ci.yml@master

